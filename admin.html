<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WT Framing | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --yellow:#ffb400;
    --black:#080808;
    --card:#1b1b1b;
    --gray:#aaa;
}

* {
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body {
    margin:0;
    background:var(--black);
    color:white;
}

.login-screen,
#dashboard {
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.login-screen {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box {
    width:min(420px,100%);
    background:var(--card);
    padding:35px;
    border-radius:12px;
    border:1px solid #333;
}

h1,h2,h3 { margin-top:0; }

.yellow { color:var(--yellow); }

input,textarea {
    width:100%;
    background:#0c0c0c;
    border:1px solid #333;
    color:white;
    padding:14px;
    border-radius:6px;
    margin-bottom:12px;
}

textarea {
    min-height:100px;
}

button {
    border:0;
    border-radius:6px;
    padding:13px 18px;
    font-weight:bold;
    cursor:pointer;
}

.yellow-btn {
    background:var(--yellow);
    color:black;
}

.dark-btn {
    background:#333;
    color:white;
}

.topbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding-bottom:25px;
    border-bottom:1px solid #292929;
}

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
    margin-top:30px;
}

.panel {
    background:var(--card);
    border:1px solid #303030;
    border-radius:12px;
    padding:25px;
}

.post-admin,
.item {
    background:#101010;
    padding:15px;
    border-radius:8px;
    margin-top:15px;
}

.post-admin img {
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:7px;
    margin-bottom:12px;
}

.reply {
    color:var(--gray);
    border-left:3px solid var(--yellow);
    padding-left:10px;
    margin-top:8px;
}

.small {
    font-size:.9rem;
    color:var(--gray);
}

.hidden { display:none; }

@media(max-width:600px) {
    .topbar {
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>WT <span class="yellow">ADMIN</span></h1>
        <p class="small">Sign in to manage your website.</p>

        <form id="loginForm">
            <input id="loginEmail" type="email" placeholder="Email" required>
            <input id="loginPassword" type="password" placeholder="Password" required>

            <button class="yellow-btn" type="submit">LOGIN</button>
        </form>
    </div>
</div>

<div id="dashboard" class="hidden">

    <div class="topbar">
        <div>
            <h1>WT <span class="yellow">ADMIN PANEL</span></h1>
            <p class="small">Manage posts, comments and reviews.</p>
        </div>

        <button class="dark-btn" onclick="logout()">LOG OUT</button>
    </div>

    <div class="grid">

        <div class="panel">
            <h2>📸 Create New Post</h2>

            <form id="postForm">
                <input id="postTitle" type="text" placeholder="Project title" required>

                <textarea id="postDescription" placeholder="Project description"></textarea>

                <input id="postImage" type="file" accept="image/*" required>

                <button class="yellow-btn" type="submit">
                    UPLOAD & POST
                </button>
            </form>
        </div>

        <div class="panel">
            <h2>📊 Quick Info</h2>

            <p id="postCount">Posts: Loading...</p>
            <p id="reviewCount">Reviews: Loading...</p>
            <p id="commentCount">Comments: Loading...</p>
        </div>

    </div>

    <div class="grid">
        <div class="panel">
            <h2>📷 Your Posts</h2>
            <div id="adminPosts"></div>
        </div>

        <div class="panel">
            <h2>💬 Customer Comments</h2>
            <div id="adminComments"></div>
        </div>
    </div>

    <div class="panel" style="margin-top:25px;">
        <h2>⭐ Customer Reviews</h2>
        <div id="adminReviews"></div>
    </div>

</div>

<script>
const SUPABASE_URL = "https://uqjtidtuvmexlwfkpeib.supabase.co";
const SUPABASE_KEY = "sb_publishable_gE0LDHvExmW98ZTXgzcoRg_wwHO4uDM";

/* TROQUE PELO E-MAIL DA SUA CONTA ADMIN */
const ADMIN_EMAIL = "ryuukryuuk99@gmail.com";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const loginScreen = document.getElementById("loginScreen");
const dashboard = document.getElementById("dashboard");

async function isAdmin() {
    const { data } = await supabase.auth.getUser();

    if (!data.user) return false;

    return data.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

async function checkUser() {
    const { data } = await supabase.auth.getSession();

    if (!data.session) {
        loginScreen.classList.remove("hidden");
        dashboard.classList.add("hidden");
        return;
    }

    if (!(await isAdmin())) {
        await supabase.auth.signOut();
        alert("Access denied. This account is not an administrator.");
        return;
    }

    showDashboard();
}

async function showDashboard() {
    loginScreen.classList.add("hidden");
    dashboard.classList.remove("hidden");

    await loadDashboard();
}

document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();

    const email = document
        .getElementById("loginEmail")
        .value
        .trim();

    const password = document
        .getElementById("loginPassword")
        .value;

    const { error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert("Login error: " + error.message);
        return;
    }

    const admin = await isAdmin();

    if (!admin) {
        await supabase.auth.signOut();
        alert("Access denied. This account is not an administrator.");
        return;
    }

    alert("Login successful!");
    await showDashboard();
});

async function logout() {
    await supabase.auth.signOut();
    location.reload();
}

document.getElementById("postForm").addEventListener("submit", async event => {
    event.preventDefault();

    const title = document.getElementById("postTitle").value.trim();
    const description = document.getElementById("postDescription").value.trim();
    const image = document.getElementById("postImage").files[0];

    if (!image) return;

    const extension = image.name.split(".").pop();
    const fileName = `${Date.now()}-${crypto.randomUUID()}.${extension}`;

    const { error: uploadError } = await supabase
        .storage
        .from("work-images")
        .upload(fileName, image, {
            contentType: image.type
        });

    if (uploadError) {
        alert("Upload error: " + uploadError.message);
        return;
    }

    const { data: publicURL } = supabase
        .storage
        .from("work-images")
        .getPublicUrl(fileName);

    const { error: postError } = await supabase
        .from("posts")
        .insert({
            title,
            description,
            image_url: publicURL.publicUrl
        });

    if (postError) {
        alert("Could not create post: " + postError.message);
        return;
    }

    alert("Post published successfully! 🔥");
    event.target.reset();
    loadDashboard();
});

async function loadDashboard() {

    const [
        postsResult,
        commentsResult,
        reviewsResult
    ] = await Promise.all([
        supabase.from("posts").select("*").order("created_at", {ascending:false}),
        supabase.from("comments").select("*").order("created_at", {ascending:false}),
        supabase.from("reviews").select("*").order("created_at", {ascending:false})
    ]);

    const posts = postsResult.data || [];
    const comments = commentsResult.data || [];
    const reviews = reviewsResult.data || [];

    document.getElementById("postCount").textContent = `Posts: ${posts.length}`;
    document.getElementById("commentCount").textContent = `Comments: ${comments.length}`;
    document.getElementById("reviewCount").textContent = `Reviews: ${reviews.length}`;

    renderPosts(posts);
    renderComments(comments);
    renderReviews(reviews);
}

function renderPosts(posts) {
    const container = document.getElementById("adminPosts");

    if (!posts.length) {
        container.innerHTML = "<p class='small'>No posts yet.</p>";
        return;
    }

    container.innerHTML = posts.map(post => `
        <div class="post-admin">
            <img src="${post.image_url}" alt="Project image">
            <h3>${escapeHTML(post.title)}</h3>
            <p class="small">${escapeHTML(post.description || "")}</p>

            <button class="dark-btn" onclick="deletePost('${post.id}')">
                DELETE POST
            </button>
        </div>
    `).join("");
}

function renderComments(comments) {
    const container = document.getElementById("adminComments");

    if (!comments.length) {
        container.innerHTML = "<p class='small'>No comments yet.</p>";
        return;
    }

    container.innerHTML = comments.map(comment => `
        <div class="item">
            <strong class="yellow">${escapeHTML(comment.customer_name)}</strong>
            <p>${escapeHTML(comment.comment)}</p>

            ${comment.admin_reply ? `
                <div class="reply">
                    <strong>WT Framing:</strong><br>
                    ${escapeHTML(comment.admin_reply)}
                </div>
            ` : ""}

            <textarea id="commentReply-${comment.id}" placeholder="Write a reply..."></textarea>

            <button class="yellow-btn" onclick="replyComment('${comment.id}')">
                REPLY
            </button>

            <button class="dark-btn" onclick="deleteComment('${comment.id}')">
                DELETE
            </button>
        </div>
    `).join("");
}

function renderReviews(reviews) {
    const container = document.getElementById("adminReviews");

    if (!reviews.length) {
        container.innerHTML = "<p class='small'>No reviews yet.</p>";
        return;
    }

    container.innerHTML = reviews.map(review => `
        <div class="item">
            <strong class="yellow">${escapeHTML(review.customer_name)}</strong>
            <p>${"⭐".repeat(review.rating)}</p>
            <p>${escapeHTML(review.comment)}</p>

            ${review.admin_reply ? `
                <div class="reply">
                    <strong>WT Framing:</strong><br>
                    ${escapeHTML(review.admin_reply)}
                </div>
            ` : ""}

            <textarea id="reviewReply-${review.id}" placeholder="Write a reply..."></textarea>

            <button class="yellow-btn" onclick="replyReview('${review.id}')">
                REPLY
            </button>

            <button class="dark-btn" onclick="deleteReview('${review.id}')">
                DELETE
            </button>
        </div>
    `).join("");
}

async function replyComment(id) {
    const text = document.getElementById(`commentReply-${id}`).value.trim();
    if (!text) return;

    const { error } = await supabase
        .from("comments")
        .update({ admin_reply: text })
        .eq("id", id);

    if (error) alert(error.message);
    else loadDashboard();
}

async function replyReview(id) {
    const text = document.getElementById(`reviewReply-${id}`).value.trim();
    if (!text) return;

    const { error } = await supabase
        .from("reviews")
        .update({ admin_reply: text })
        .eq("id", id);

    if (error) alert(error.message);
    else loadDashboard();
}

async function deleteComment(id) {
    if (!confirm("Delete this comment?")) return;

    const { error } = await supabase
        .from("comments")
        .delete()
        .eq("id", id);

    if (error) alert(error.message);
    else loadDashboard();
}

async function deleteReview(id) {
    if (!confirm("Delete this review?")) return;

    const { error } = await supabase
        .from("reviews")
        .delete()
        .eq("id", id);

    if (error) alert(error.message);
    else loadDashboard();
}

async function deletePost(id) {
    if (!confirm("Delete this post?")) return;

    const { error } = await supabase
        .from("posts")
        .delete()
        .eq("id", id);

    if (error) alert(error.message);
    else loadDashboard();
}

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value || "";
    return div.innerHTML;
}

checkUser();
</script>

</body>
</html>
