<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WT Framing | Admin Panel</title>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --yellow: #ffb400;
            --black: #080808;
            --dark: #121212;
            --card: #1b1b1b;
            --gray: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: var(--black);
            color: white;
        }

        .hidden {
            display: none !important;
        }

        /* LOGIN */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 35px;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        .yellow {
            color: var(--yellow);
        }

        .small {
            color: var(--gray);
            font-size: 0.9rem;
        }

        input,
        textarea {
            width: 100%;
            background: #0c0c0c;
            border: 1px solid #333;
            color: white;
            padding: 14px;
            border-radius: 7px;
            margin-bottom: 12px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            border: none;
            padding: 13px 18px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .yellow-btn {
            background: var(--yellow);
            color: black;
        }

        .dark-btn {
            background: #333;
            color: white;
        }

        /* DASHBOARD */

        #dashboard {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 60px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 1px solid #292929;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .panel {
            background: var(--card);
            border: 1px solid #303030;
            border-radius: 12px;
            padding: 25px;
        }

        .item {
            background: #101010;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .post-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .reply {
            border-left: 3px solid var(--yellow);
            padding-left: 10px;
            margin: 12px 0;
            color: var(--gray);
        }

        .error-message {
            color: #ff5b5b;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginScreen">

    <div class="login-box">

        <h1>WT <span class="yellow">ADMIN</span></h1>

        <p class="small">
            Sign in to manage your website.
        </p>

        <form id="loginForm">

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="yellow-btn"
            >
                LOGIN
            </button>

            <div
                id="loginError"
                class="error-message"
            ></div>

        </form>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard" class="hidden">

    <div class="topbar">

        <div>
            <h1>
                WT <span class="yellow">ADMIN PANEL</span>
            </h1>

            <p class="small">
                Manage your construction website.
            </p>
        </div>

        <button
            class="dark-btn"
            id="logoutButton"
        >
            LOG OUT
        </button>

    </div>


    <!-- CREATE POST + INFO -->

    <div class="grid">

        <div class="panel">

            <h2>📸 Create New Post</h2>

            <form id="postForm">

                <input
                    id="postTitle"
                    type="text"
                    placeholder="Project title"
                    required
                >

                <textarea
                    id="postDescription"
                    placeholder="Project description"
                ></textarea>

                <input
                    id="postImage"
                    type="file"
                    accept="image/*"
                    required
                >

                <button
                    type="submit"
                    class="yellow-btn"
                >
                    UPLOAD & POST
                </button>

            </form>

        </div>


        <div class="panel">

            <h2>📊 Quick Info</h2>

            <p id="postCount">
                Posts: Loading...
            </p>

            <p id="commentCount">
                Comments: Loading...
            </p>

            <p id="reviewCount">
                Reviews: Loading...
            </p>

        </div>

    </div>


    <!-- POSTS + COMMENTS -->

    <div class="grid">

        <div class="panel">

            <h2>📷 Your Posts</h2>

            <div id="adminPosts">
                Loading...
            </div>

        </div>


        <div class="panel">

            <h2>💬 Customer Comments</h2>

            <div id="adminComments">
                Loading...
            </div>

        </div>

    </div>


    <!-- REVIEWS -->

    <div class="panel" style="margin-top:25px;">

        <h2>⭐ Customer Reviews</h2>

        <div id="adminReviews">
            Loading...
        </div>

    </div>

</div>


<script>

/* ==========================================
   CONFIGURATION
========================================== */

const SUPABASE_URL = "https://uqjtidtuvmexlwfkpeib.supabase.co";

const SUPABASE_KEY = "sb_publishable_gE0LDHvExmW98ZTXgzcoRg_wwHO4uDM";

const ADMIN_EMAIL = "ryuukryuuk99@gmail.com".toLowerCase();


/* ==========================================
   SUPABASE
========================================== */

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   ELEMENTS
========================================== */

const loginScreen = document.getElementById("loginScreen");

const dashboard = document.getElementById("dashboard");

const loginForm = document.getElementById("loginForm");

const loginError = document.getElementById("loginError");

const postForm = document.getElementById("postForm");


/* ==========================================
   ADMIN CHECK
========================================== */

async function isAdmin() {

    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
        return false;
    }

    return data.user.email?.toLowerCase().trim() === ADMIN_EMAIL.toLowerCase().trim();


/* ==========================================
   CHECK LOGIN WHEN PAGE OPENS
========================================== */

async function checkUser() {

    loginError.textContent = "";

    const { data } = await supabaseClient.auth.getSession();

    if (!data.session) {

        loginScreen.classList.remove("hidden");

        dashboard.classList.add("hidden");

        return;
    }

    const admin = await isAdmin();

    if (!admin) {

        await supabaseClient.auth.signOut();

        alert("Access denied. This account is not an administrator.");

        return;
    }

    await showDashboard();
}


/* ==========================================
   SHOW DASHBOARD
========================================== */

async function showDashboard() {

    loginScreen.classList.add("hidden");

    dashboard.classList.remove("hidden");

    await loadDashboard();
}


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginError.textContent = "";

        const email =
            document.getElementById("loginEmail")
            .value
            .trim();

        const password =
            document.getElementById("loginPassword")
            .value;

        const { error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {

            console.error(error);

            loginError.textContent =
                error.message;

            return;
        }

        const admin = await isAdmin();

        if (!admin) {

            await supabaseClient.auth.signOut();

            loginError.textContent =
                "This account is not authorized as administrator.";

            return;
        }

        await showDashboard();

    }
);


/* ==========================================
   LOGOUT
========================================== */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            location.reload();

        }
    );


/* ==========================================
   CREATE POST
========================================== */

postForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const title =
            document
            .getElementById("postTitle")
            .value
            .trim();

        const description =
            document
            .getElementById("postDescription")
            .value
            .trim();

        const image =
            document
            .getElementById("postImage")
            .files[0];

        if (!image) {

            alert("Please select an image.");

            return;
        }


        const extension =
            image.name
            .split(".")
            .pop();


        const fileName =
            Date.now() +
            "-" +
            crypto.randomUUID() +
            "." +
            extension;


        const { error: uploadError } =
            await supabaseClient
            .storage
            .from("work-images")
            .upload(
                fileName,
                image,
                {
                    contentType: image.type
                }
            );


        if (uploadError) {

            console.error(uploadError);

            alert(
                "Image upload error: " +
                uploadError.message
            );

            return;
        }


        const { data: urlData } =
            supabaseClient
            .storage
            .from("work-images")
            .getPublicUrl(fileName);


        const { error: postError } =
            await supabaseClient
            .from("posts")
            .insert({
                title: title,
                description: description,
                image_url: urlData.publicUrl
            });


        if (postError) {

            console.error(postError);

            alert(
                "Post creation error: " +
                postError.message
            );

            return;
        }


        alert("Post published successfully! 🔥");


        postForm.reset();


        await loadDashboard();

    }
);


/* ==========================================
   LOAD DASHBOARD
========================================== */

async function loadDashboard() {

    const results =
        await Promise.all([

            supabaseClient
            .from("posts")
            .select("*")
            .order(
                "created_at",
                { ascending: false }
            ),

            supabaseClient
            .from("comments")
            .select("*")
            .order(
                "created_at",
                { ascending: false }
            ),

            supabaseClient
            .from("reviews")
            .select("*")
            .order(
                "created_at",
                { ascending: false }
            )

        ]);


    const postsResult = results[0];

    const commentsResult = results[1];

    const reviewsResult = results[2];


    if (postsResult.error) {
        console.error(
            "Posts error:",
            postsResult.error
        );
    }


    if (commentsResult.error) {
        console.error(
            "Comments error:",
            commentsResult.error
        );
    }


    if (reviewsResult.error) {
        console.error(
            "Reviews error:",
            reviewsResult.error
        );
    }


    const posts =
        postsResult.data || [];

    const comments =
        commentsResult.data || [];

    const reviews =
        reviewsResult.data || [];


    document
        .getElementById("postCount")
        .textContent =
        "Posts: " + posts.length;


    document
        .getElementById("commentCount")
        .textContent =
        "Comments: " + comments.length;


    document
        .getElementById("reviewCount")
        .textContent =
        "Reviews: " + reviews.length;


    renderPosts(posts);

    renderComments(comments);

    renderReviews(reviews);

}


/* ==========================================
   RENDER POSTS
========================================== */

function renderPosts(posts) {

    const container =
        document.getElementById("adminPosts");


    if (!posts.length) {

        container.innerHTML =
            "<p class='small'>No posts yet.</p>";

        return;
    }


    container.innerHTML =
        posts
        .map(function(post) {

            return `

            <div class="item">

                <img
                    class="post-image"
                    src="${escapeHTML(post.image_url)}"
                    alt="Project image"
                >

                <h3>
                    ${escapeHTML(post.title)}
                </h3>

                <p class="small">
                    ${escapeHTML(
                        post.description || ""
                    )}
                </p>

                <button
                    class="dark-btn"
                    onclick="deletePost('${post.id}')"
                >
                    DELETE POST
                </button>

            </div>

            `;

        })
        .join("");

}


/* ==========================================
   RENDER COMMENTS
========================================== */

function renderComments(comments) {

    const container =
        document.getElementById("adminComments");


    if (!comments.length) {

        container.innerHTML =
            "<p class='small'>No comments yet.</p>";

        return;
    }


    container.innerHTML =
        comments
        .map(function(comment) {

            return `

            <div class="item">

                <strong class="yellow">
                    ${escapeHTML(
                        comment.customer_name || "Customer"
                    )}
                </strong>

                <p>
                    ${escapeHTML(
                        comment.comment || ""
                    )}
                </p>


                ${
                    comment.admin_reply
                    ?
                    `

                    <div class="reply">

                        <strong>
                            WT Framing:
                        </strong>

                        <br>

                        ${escapeHTML(
                            comment.admin_reply
                        )}

                    </div>

                    `
                    :
                    ""
                }


                <textarea
                    id="commentReply-${comment.id}"
                    placeholder="Write a reply..."
                ></textarea>


                <button
                    class="yellow-btn"
                    onclick="replyComment('${comment.id}')"
                >
                    REPLY
                </button>


                <button
                    class="dark-btn"
                    onclick="deleteComment('${comment.id}')"
                >
                    DELETE
                </button>

            </div>

            `;

        })
        .join("");

}


/* ==========================================
   RENDER REVIEWS
========================================== */

function renderReviews(reviews) {

    const container =
        document.getElementById("adminReviews");


    if (!reviews.length) {

        container.innerHTML =
            "<p class='small'>No reviews yet.</p>";

        return;
    }


    container.innerHTML =
        reviews
        .map(function(review) {

            const rating =
                Number(review.rating) || 0;


            return `

            <div class="item">

                <strong class="yellow">
                    ${escapeHTML(
                        review.customer_name || "Customer"
                    )}
                </strong>


                <p>
                    ${"⭐".repeat(rating)}
                </p>


                <p>
                    ${escapeHTML(
                        review.comment || ""
                    )}
                </p>


                ${
                    review.admin_reply
                    ?
                    `

                    <div class="reply">

                        <strong>
                            WT Framing:
                        </strong>

                        <br>

                        ${escapeHTML(
                            review.admin_reply
                        )}

                    </div>

                    `
                    :
                    ""
                }


                <textarea
                    id="reviewReply-${review.id}"
                    placeholder="Write a reply..."
                ></textarea>


                <button
                    class="yellow-btn"
                    onclick="replyReview('${review.id}')"
                >
                    REPLY
                </button>


                <button
                    class="dark-btn"
                    onclick="deleteReview('${review.id}')"
                >
                    DELETE
                </button>

            </div>

            `;

        })
        .join("");

}


/* ==========================================
   REPLY COMMENT
========================================== */

async function replyComment(id) {

    const textarea =
        document.getElementById(
            "commentReply-" + id
        );


    const text =
        textarea.value.trim();


    if (!text) {

        alert("Write a reply first.");

        return;
    }


    const { error } =
        await supabaseClient
        .from("comments")
        .update({
            admin_reply: text
        })
        .eq("id", id);


    if (error) {

        console.error(error);

        alert(error.message);

        return;
    }


    await loadDashboard();

}


/* ==========================================
   REPLY REVIEW
========================================== */

async function replyReview(id) {

    const textarea =
        document.getElementById(
            "reviewReply-" + id
        );


    const text =
        textarea.value.trim();


    if (!text) {

        alert("Write a reply first.");

        return;
    }


    const { error } =
        await supabaseClient
        .from("reviews")
        .update({
            admin_reply: text
        })
        .eq("id", id);


    if (error) {

        console.error(error);

        alert(error.message);

        return;
    }


    await loadDashboard();

}


/* ==========================================
   DELETE COMMENT
========================================== */

async function deleteComment(id) {

    if (
        !confirm(
            "Delete this comment?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseClient
        .from("comments")
        .delete()
        .eq("id", id);


    if (error) {

        alert(error.message);

        return;
    }


    await loadDashboard();

}


/* ==========================================
   DELETE REVIEW
========================================== */

async function deleteReview(id) {

    if (
        !confirm(
            "Delete this review?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseClient
        .from("reviews")
        .delete()
        .eq("id", id);


    if (error) {

        alert(error.message);

        return;
    }


    await loadDashboard();

}


/* ==========================================
   DELETE POST
========================================== */

async function deletePost(id) {

    if (
        !confirm(
            "Delete this post?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseClient
        .from("posts")
        .delete()
        .eq("id", id);


    if (error) {

        alert(error.message);

        return;
    }


    await loadDashboard();

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;

}


/* ==========================================
   START
========================================== */

checkUser();

</script>

</body>
</html>
